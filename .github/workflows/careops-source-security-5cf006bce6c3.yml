# Vendored from edithatogo/careops at 5cf006bce6c37c0c15db5d35055e302701a500ad; see matching shared/provenance.json.
name: Reusable source security
on:
  workflow_call:
    inputs:
      policy-revision:
        description: Exact qualified CareOps commit containing the shared tools and hash lock
        required: true
        type: string
permissions:
  contents: read
jobs:
  baseline:
    name: Shared source security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: runtime
        with:
          python-version: '3.15.2'
      - name: Bootstrap the repository-owned verified runtime
        run: python tools/python_runtime.py --github
      - name: Check caller full history for secrets
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          if ! "$RUNNER_TEMP/gitleaks" git . --log-opts=--all --redact --no-banner > "$RUNNER_TEMP/shared-gitleaks.log" 2>&1; then
            echo 'Secret scan failed; inspect locally with redaction. Matched content is withheld from CI logs.' >&2
            exit 1
          fi
      - name: Verify exact vendored source policy
        env:
          POLICY_REVISION: ${{ inputs.policy-revision }}
          EXPECTED_POLICY_REVISION: 5cf006bce6c37c0c15db5d35055e302701a500ad
        run: |
          "$CAREOPS_PYTHON" -I - <<'PYCODE'
          import hashlib, json, os, pathlib
          root = pathlib.Path('.careops-security/shared/5cf006bce6c37c0c15db5d35055e302701a500ad')
          manifest = json.loads((root / 'provenance.json').read_text())
          expected = os.environ['EXPECTED_POLICY_REVISION']
          if manifest['sourceCommit'] != expected or os.environ['POLICY_REVISION'] != expected or manifest['sourceRepository'] != 'edithatogo/careops':
              raise SystemExit('Vendored source selection mismatch')
          names = {'portfolio-scripts/ci_delivery.py', 'portfolio-scripts/check_workflow_pins.py', 'requirements-ci.txt', 'requirements-ci.lock', 'LICENSE'}
          if set(manifest['files']) != names:
              raise SystemExit('Vendored source inventory mismatch')
          for name in names:
              path = root / name
              if path.is_symlink() or hashlib.sha256(path.read_bytes()).hexdigest() != manifest['files'][name]:
                  raise SystemExit('Vendored source integrity mismatch')
          print('Exact vendored source integrity verified')
          PYCODE
      - name: Reject stale exact caller CI tool declarations
        run: |
          if [ -f requirements-ci.txt ]; then
            "$CAREOPS_PYTHON" .careops-security/shared/5cf006bce6c37c0c15db5d35055e302701a500ad/portfolio-scripts/ci_delivery.py verify-lock --root .
          fi
      - run: |
          "$CAREOPS_PYTHON" -m pip install --require-hashes -r .careops-security/shared/5cf006bce6c37c0c15db5d35055e302701a500ad/requirements-ci.lock
      - run: |
          "$CAREOPS_PYTHON" .careops-security/shared/5cf006bce6c37c0c15db5d35055e302701a500ad/portfolio-scripts/check_workflow_pins.py
      - name: Validate workflow syntax and security
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
          zizmor --offline --persona pedantic --format plain .github/workflows
