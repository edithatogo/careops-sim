name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    timeout-minutes: 5
    name: scope
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        name: Detect Rust, tool, or Conductor changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BASE_SHA"
          fi
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$base" HEAD -- Cargo.toml Cargo.lock deny.toml .gitleaksignore requirements-schema-validation.txt crates tests model-inputs tools conductor .gitmodules .github/workflows libs/kairos extensions/conductor fuzz; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

  fmt:
    timeout-minutes: 10
    name: fmt
    needs: scope
    if: needs.scope.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust 1.98.1
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Format
        run: cargo +1.98.1 fmt --all --check

  clippy:
    timeout-minutes: 15
    name: clippy
    needs: scope
    if: needs.scope.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust 1.98.1
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy
      - name: Clippy
        run: cargo +1.98.1 clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    timeout-minutes: 20
    name: test (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust 1.98.1
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Verify native host
        env:
          EXPECTED_OS: ${{ matrix.os }}
        run: |
          uname -a
          rustc +1.98.1 -vV
          if [ "$EXPECTED_OS" = macos-15 ]; then
            test "$(uname -m)" = arm64
          else
            test "$(uname -m)" = x86_64
          fi
      - name: Unit and integration tests
        run: |
          mkdir -p .artifacts/ci/native
          set -o pipefail
          cargo +1.98.1 test --workspace --all-features --lib --bins --tests --locked 2>&1 | tee .artifacts/ci/native/tests.log
      - name: Retain bounded failed native log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-failure-${{ matrix.os }}
          path: .artifacts/ci/native/*.log
          retention-days: 7
          if-no-files-found: error

  fuzz:
    timeout-minutes: 20
    name: fuzz (nightly 2026-10-02)
    needs: scope
    if: needs.scope.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dated nightly and pinned cargo-fuzz with retained setup log
        run: |
          mkdir -p .artifacts/ci/fuzz
          set -o pipefail
          rustup toolchain install nightly-2026-10-02 --profile minimal 2>&1 | tee .artifacts/ci/fuzz/install.log
          nightly_rustc="$(rustup which rustc --toolchain nightly-2026-10-02)"
          nightly_bin="$(dirname "$nightly_rustc")"
          export RUSTC="$nightly_rustc"
          export RUSTDOC="$nightly_bin/rustdoc"
          export PATH="$nightly_bin:$PATH"
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          rustc -vV | tee -a .artifacts/ci/fuzz/install.log
          grep -Fx 'host: x86_64-unknown-linux-gnu' .artifacts/ci/fuzz/install.log
          rustdoc --version | tee -a .artifacts/ci/fuzz/install.log
          cargo -vV | tee -a .artifacts/ci/fuzz/install.log
          cargo install cargo-fuzz --version 0.13.2 --locked --root .artifacts/ci/fuzz-tools 2>&1 | tee -a .artifacts/ci/fuzz/install.log
          echo "$GITHUB_WORKSPACE/.artifacts/ci/fuzz-tools/bin" >> "$GITHUB_PATH"
      - name: Run bounded synthetic ED parser fuzzing
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-10-02
        run: |
          set -o pipefail
          nightly_rustc="$(rustup which rustc --toolchain nightly-2026-10-02)"
          nightly_bin="$(dirname "$nightly_rustc")"
          export RUSTC="$nightly_rustc"
          export RUSTDOC="$nightly_bin/rustdoc"
          export PATH="$nightly_bin:$GITHUB_WORKSPACE/.artifacts/ci/fuzz-tools/bin:$PATH"
          rustc -vV | grep -Fx 'host: x86_64-unknown-linux-gnu'
          mkdir -p .artifacts/ci/fuzz/corpus
          cp crates/careops-ed/examples/one_patient.json .artifacts/ci/fuzz/corpus/synthetic-one-patient.json
          cargo fuzz run parse_scenario_json .artifacts/ci/fuzz/corpus -- -seed=20261003 -runs=100000 -max_total_time=120 -max_len=32768 -timeout=5 -rss_limit_mb=1024 2>&1 | tee .artifacts/ci/fuzz/fuzz.log
          test -s .artifacts/ci/fuzz/fuzz.log
          git diff --quiet -- fuzz/Cargo.lock
      - name: Retain bounded fuzz log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parser-fuzz-failure
          path: |
            .artifacts/ci/fuzz/
            fuzz/artifacts/parse_scenario_json/
          retention-days: 7
          if-no-files-found: ignore

  miri:
    timeout-minutes: 20
    name: miri (nightly 2026-10-02, kairo-ecs-ffi integration)
    needs: scope
    if: needs.scope.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dated nightly Miri and capture host/toolchain/sysroot
        run: |
          set -o pipefail
          mkdir -p .artifacts/ci/miri
          rustup toolchain install nightly-2026-10-02 --profile minimal --component miri --component rust-src 2>&1 | tee .artifacts/ci/miri/setup.log
          nightly_rustc="$(rustup which rustc --toolchain nightly-2026-10-02)"
          nightly_bin="$(dirname "$nightly_rustc")"
          nightly_cargo="$nightly_bin/cargo"
          test -x "$nightly_rustc"
          test -x "$nightly_cargo"
          test -x "$nightly_bin/rustdoc"
          test -x "$nightly_bin/miri"
          test -x "$nightly_bin/cargo-miri"
          export PATH="$nightly_bin:$PATH"
          export RUSTUP_TOOLCHAIN=nightly-2026-10-02
          export RUSTDOC="$nightly_bin/rustdoc"
          export MIRI="$nightly_bin/miri"
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(command -v rustc)" = "$nightly_rustc"
          test "$(command -v cargo)" = "$nightly_cargo"
          rustc -vV | tee -a .artifacts/ci/miri/setup.log
          grep -Fx 'host: x86_64-unknown-linux-gnu' .artifacts/ci/miri/setup.log
          rustdoc --version | tee -a .artifacts/ci/miri/setup.log
          cargo -vV | tee -a .artifacts/ci/miri/setup.log
          miri --version | tee -a .artifacts/ci/miri/setup.log
          rustup component list --toolchain nightly-2026-10-02 --installed | tee -a .artifacts/ci/miri/setup.log
          grep -Fx 'miri-x86_64-unknown-linux-gnu' .artifacts/ci/miri/setup.log
          grep -Fx 'rust-src' .artifacts/ci/miri/setup.log
          cargo miri setup 2>&1 | tee -a .artifacts/ci/miri/setup.log
      - name: Run exact Kairos FFI integration target under Miri
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-10-02
        run: |
          set -o pipefail
          nightly_rustc="$(rustup which rustc --toolchain nightly-2026-10-02)"
          nightly_bin="$(dirname "$nightly_rustc")"
          nightly_cargo="$nightly_bin/cargo"
          export PATH="$nightly_bin:$PATH"
          export RUSTDOC="$nightly_bin/rustdoc"
          export MIRI="$nightly_bin/miri"
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(command -v rustc)" = "$nightly_rustc"
          test "$(command -v cargo)" = "$nightly_cargo"
          cargo miri test --manifest-path libs/kairos/Cargo.toml -p kairo-ecs-ffi --test ffi_integration --locked 2>&1 | tee .artifacts/ci/miri/test.log
          test -s .artifacts/ci/miri/test.log
      - name: Retain bounded Miri setup and test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: selective-miri-logs
          path: .artifacts/ci/miri/*.log
          retention-days: 7
          if-no-files-found: ignore

  doctest:
    timeout-minutes: 15
    name: doctest
    needs: scope
    if: needs.scope.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust 1.98.1
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Documentation tests
        run: cargo +1.98.1 test --doc --workspace --all-features --locked

  context:
    timeout-minutes: 10
    name: context
    needs: scope
    if: needs.scope.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Check Conductor context and exact Kairos contract
        run: |
          python3 tools/check_kairos_pin.py
          python3 tools/context.py check
          python3 tools/tasks.py check
          python3 tools/mvp.py check
      - name: Install locked harness dependencies
        run: |
          python3 -m venv .artifacts/ci/harness-venv
          .artifacts/ci/harness-venv/bin/pip install -r requirements-schema-validation.txt
      - name: Run harness and incompatible-pin regressions
        run: .artifacts/ci/harness-venv/bin/python -m unittest discover -s tests -v

  policy:
    name: policy
    timeout-minutes: 15
    needs: scope
    if: needs.scope.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Install reviewed checksum-bound policy binaries
        run: python3 tools/install_ci_tools.py
      - name: Install Rust 1.98.1
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Check all dependency, secret and workflow policies
        run: |
          export RUSTUP_TOOLCHAIN=1.98.1
          python3 tools/ci_policy.py
          cargo deny --manifest-path fuzz/Cargo.toml --config fuzz/deny.toml --locked check
      - name: Retain bounded failed policy logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: policy-failure
          path: .artifacts/ci/policy/
          retention-days: 7
          if-no-files-found: error

  required:
    timeout-minutes: 5
    name: Required checks
    if: always()
    needs: [scope, fmt, clippy, test, fuzz, miri, doctest, context, policy]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required lanes and report unchanged scope
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SCOPE_CHANGED: ${{ needs.scope.outputs.changed }}
          FMT_RESULT: ${{ needs.fmt.result }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
          TEST_RESULT: ${{ needs.test.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
          MIRI_RESULT: ${{ needs.miri.result }}
          DOCTEST_RESULT: ${{ needs.doctest.result }}
          CONTEXT_RESULT: ${{ needs.context.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
        run: |
          set -eu
          if [ "$SCOPE_RESULT" != success ]; then
            echo "scope detection failed: $SCOPE_RESULT"
            exit 1
          fi
          if [ "$SCOPE_CHANGED" != true ] && [ "$SCOPE_CHANGED" != false ]; then
            echo "invalid scope output: $SCOPE_CHANGED"
            exit 1
          fi
          if [ "$SCOPE_CHANGED" = false ]; then
            for lane in "$FMT_RESULT" "$CLIPPY_RESULT" "$TEST_RESULT" "$FUZZ_RESULT" "$MIRI_RESULT" "$DOCTEST_RESULT" "$CONTEXT_RESULT" "$POLICY_RESULT"; do
              if [ "$lane" != skipped ]; then
                echo "unchanged scope expected skipped lanes; observed $lane"
                exit 1
              fi
            done
            echo "scope unchanged: all required lanes skipped successfully"
            exit 0
          fi
          for result in "$FMT_RESULT" "$CLIPPY_RESULT" "$TEST_RESULT" "$FUZZ_RESULT" "$MIRI_RESULT" "$DOCTEST_RESULT" "$CONTEXT_RESULT" "$POLICY_RESULT"; do
            if [ "$result" != success ]; then
              echo "required lane failed or did not run: $result"
              exit 1
            fi
          done
          echo "all required lanes passed"
