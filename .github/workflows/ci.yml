name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    timeout-minutes: 5
    name: scope
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      native: ${{ steps.detect.outputs.native }}
      context: ${{ steps.detect.outputs.context }}
      policy: ${{ steps.detect.outputs.policy }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        name: Detect CI lane scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BASE_SHA"
          fi
          head="$(git rev-parse HEAD 2>/dev/null || true)"
          python3 tools/ci_scope.py --base "$base" --head "$head" --output "$GITHUB_OUTPUT"

  fmt:
    timeout-minutes: 10
    name: fmt
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust 1.99.0
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt
      - name: Format
        run: cargo +1.99.0 fmt --all --check

  clippy:
    timeout-minutes: 15
    name: clippy
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust 1.99.0
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy
      - name: Clippy
        run: cargo +1.99.0 clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    timeout-minutes: 20
    name: test (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust 1.99.0
        run: |
          set -euo pipefail
          mkdir -p .artifacts/ci/nextest
          rustup toolchain install 1.99.0 --profile minimal 2>&1 | tee .artifacts/ci/nextest/toolchain-install.log
      - name: Verify native host and export actual Rust tools
        env:
          EXPECTED_OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          rustc_path="$(rustup which rustc --toolchain 1.99.0)"
          rustdoc_path="$(rustup which rustdoc --toolchain 1.99.0)"
          cargo_path="$(rustup which cargo --toolchain 1.99.0)"
          toolchain_bin="$(dirname "$rustc_path")"
          test -x "$rustc_path"
          test -x "$rustdoc_path"
          test -x "$cargo_path"
          export PATH="$toolchain_bin:$PATH"
          export RUSTUP_TOOLCHAIN=1.99.0 RUSTC="$rustc_path" RUSTDOC="$rustdoc_path"
          uname -a | tee .artifacts/ci/nextest/host.log
          rustc -vV | tee -a .artifacts/ci/nextest/host.log
          rustdoc --version | tee -a .artifacts/ci/nextest/host.log
          cargo -vV | tee -a .artifacts/ci/nextest/host.log
          test "$(command -v rustc)" = "$rustc_path"
          test "$(command -v cargo)" = "$cargo_path"
          if [ "$EXPECTED_OS" = macos-15 ]; then
            test "$(uname -m)" = arm64
            grep -Fx 'host: aarch64-apple-darwin' .artifacts/ci/nextest/host.log
          else
            test "$(uname -m)" = x86_64
            grep -Fx 'host: x86_64-unknown-linux-gnu' .artifacts/ci/nextest/host.log
          fi
          {
            echo "RUSTUP_TOOLCHAIN=1.99.0"
            echo "RUSTC=$rustc_path"
            echo "RUSTDOC=$rustdoc_path"
          } >> "$GITHUB_ENV"
          echo "$toolchain_bin" >> "$GITHUB_PATH"
      - name: Verify nextest discovery, failure handling and test suite
        run: |
          set -euo pipefail
          python3 tools/nextest_ci.py --toolchain 1.99.0
      - name: Retain bounded failed native log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-failure-${{ matrix.os }}
          path: |
            .artifacts/ci/nextest/toolchain-install.log
            .artifacts/ci/nextest/host.log
            .artifacts/ci/nextest/environment.log
            .artifacts/ci/nextest/cargo-all-list.log
            .artifacts/ci/nextest/cargo-ignored-list.log
            .artifacts/ci/nextest/nextest-list.json
            .artifacts/ci/nextest/red-control.log
            .artifacts/ci/nextest/tests.log
          retention-days: 7
          if-no-files-found: error

  msrv:
    timeout-minutes: 20
    name: msrv (Rust 1.76.0, default features)
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust 1.76.0
        run: |
          set -euo pipefail
          mkdir -p .artifacts/ci/msrv
          rustup toolchain install 1.76.0 --profile minimal 2>&1 | tee .artifacts/ci/msrv/toolchain-install.log
      - name: Resolve and verify explicit Rust 1.76.0 Linux tools
        run: |
          set -euo pipefail
          rustc_path="$(rustup which rustc --toolchain 1.76.0)"
          rustdoc_path="$(rustup which rustdoc --toolchain 1.76.0)"
          cargo_path="$(rustup which cargo --toolchain 1.76.0)"
          toolchain_bin="$(dirname "$rustc_path")"
          test -x "$rustc_path"
          test -x "$rustdoc_path"
          test -x "$cargo_path"
          export PATH="$toolchain_bin:$PATH"
          export RUSTUP_TOOLCHAIN=1.76.0 RUSTC="$rustc_path" RUSTDOC="$rustdoc_path"
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(command -v rustc)" = "$rustc_path"
          test "$(command -v cargo)" = "$cargo_path"
          rustc -vV | tee .artifacts/ci/msrv/environment.log
          grep -Fx 'host: x86_64-unknown-linux-gnu' .artifacts/ci/msrv/environment.log
          rustdoc --version | tee -a .artifacts/ci/msrv/environment.log
          cargo -vV | tee -a .artifacts/ci/msrv/environment.log
          {
            echo "RUSTUP_TOOLCHAIN=1.76.0"
            echo "RUSTC=$rustc_path"
            echo "RUSTDOC=$rustdoc_path"
          } >> "$GITHUB_ENV"
          echo "$toolchain_bin" >> "$GITHUB_PATH"
      - name: Run parent default-feature workspace tests at MSRV
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR=.artifacts/ci/msrv/target
          cargo test --workspace --lib --bins --tests --locked 2>&1 | tee .artifacts/ci/msrv/tests.log
      - name: Retain bounded failed MSRV logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: msrv-failure-linux-x86_64
          path: |
            .artifacts/ci/msrv/toolchain-install.log
            .artifacts/ci/msrv/environment.log
            .artifacts/ci/msrv/tests.log
          retention-days: 7
          if-no-files-found: error

  fuzz:
    timeout-minutes: 20
    name: fuzz (nightly 2026-10-02)
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dated nightly and pinned cargo-fuzz with retained setup log
        run: |
          mkdir -p .artifacts/ci/fuzz
          set -o pipefail
          rustup toolchain install nightly-2026-10-02 --profile minimal 2>&1 | tee .artifacts/ci/fuzz/install.log
          nightly_rustc="$(rustup which rustc --toolchain nightly-2026-10-02)"
          nightly_bin="$(dirname "$nightly_rustc")"
          export RUSTC="$nightly_rustc"
          export RUSTDOC="$nightly_bin/rustdoc"
          export PATH="$nightly_bin:$PATH"
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          rustc -vV | tee -a .artifacts/ci/fuzz/install.log
          grep -Fx 'host: x86_64-unknown-linux-gnu' .artifacts/ci/fuzz/install.log
          rustdoc --version | tee -a .artifacts/ci/fuzz/install.log
          cargo -vV | tee -a .artifacts/ci/fuzz/install.log
          cargo install cargo-fuzz --version 0.13.2 --locked --root .artifacts/ci/fuzz-tools 2>&1 | tee -a .artifacts/ci/fuzz/install.log
          echo "$GITHUB_WORKSPACE/.artifacts/ci/fuzz-tools/bin" >> "$GITHUB_PATH"
      - name: Run bounded synthetic ED parser fuzzing
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-10-02
        run: |
          set -o pipefail
          nightly_rustc="$(rustup which rustc --toolchain nightly-2026-10-02)"
          nightly_bin="$(dirname "$nightly_rustc")"
          export RUSTC="$nightly_rustc"
          export RUSTDOC="$nightly_bin/rustdoc"
          export PATH="$nightly_bin:$GITHUB_WORKSPACE/.artifacts/ci/fuzz-tools/bin:$PATH"
          rustc -vV | grep -Fx 'host: x86_64-unknown-linux-gnu'
          mkdir -p .artifacts/ci/fuzz/corpus
          cp crates/careops-ed/examples/one_patient.json .artifacts/ci/fuzz/corpus/synthetic-one-patient.json
          cargo fuzz build --sanitizer address parse_scenario_json 2>&1 | tee .artifacts/ci/fuzz/build.log
          fuzz_binary="fuzz/target/x86_64-unknown-linux-gnu/release/parse_scenario_json"
          test -x "$fuzz_binary"
          nm --defined-only "$fuzz_binary" > .artifacts/ci/fuzz/symbols.txt
          grep -E '[[:space:]]__asan_init$' .artifacts/ci/fuzz/symbols.txt | tee .artifacts/ci/fuzz/sanitizer-symbols.log
          sha256sum "$fuzz_binary" | tee .artifacts/ci/fuzz/binary-sha256.txt
          cargo fuzz run --sanitizer address parse_scenario_json .artifacts/ci/fuzz/corpus -- -seed=20261003 -runs=100000 -max_total_time=120 -max_len=32768 -timeout=5 -rss_limit_mb=1024 2>&1 | tee .artifacts/ci/fuzz/fuzz.log
          sha256sum --check .artifacts/ci/fuzz/binary-sha256.txt
          test -s .artifacts/ci/fuzz/fuzz.log
          git diff --quiet -- fuzz/Cargo.lock
      - name: Retain bounded fuzz log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parser-fuzz-failure
          path: |
            .artifacts/ci/fuzz/
            fuzz/artifacts/parse_scenario_json/
          retention-days: 7
          if-no-files-found: ignore
      - name: Retain sanitizer instrumentation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parser-fuzz-instrumentation
          path: |
            .artifacts/ci/fuzz/install.log
            .artifacts/ci/fuzz/build.log
            .artifacts/ci/fuzz/sanitizer-symbols.log
            .artifacts/ci/fuzz/binary-sha256.txt
            .artifacts/ci/fuzz/fuzz.log
          retention-days: 7
          if-no-files-found: error

  miri:
    timeout-minutes: 20
    name: miri (nightly 2026-10-02, kairo-ecs-ffi integration)
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dated nightly Miri and capture host/toolchain/sysroot
        run: |
          set -o pipefail
          mkdir -p .artifacts/ci/miri
          rustup toolchain install nightly-2026-10-02 --profile minimal --component miri --component rust-src 2>&1 | tee .artifacts/ci/miri/setup.log
          nightly_rustc="$(rustup which rustc --toolchain nightly-2026-10-02)"
          nightly_bin="$(dirname "$nightly_rustc")"
          nightly_cargo="$nightly_bin/cargo"
          test -x "$nightly_rustc"
          test -x "$nightly_cargo"
          test -x "$nightly_bin/rustdoc"
          test -x "$nightly_bin/miri"
          test -x "$nightly_bin/cargo-miri"
          export PATH="$nightly_bin:$PATH"
          export RUSTUP_TOOLCHAIN=nightly-2026-10-02
          export RUSTDOC="$nightly_bin/rustdoc"
          export MIRI="$nightly_bin/miri"
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(command -v rustc)" = "$nightly_rustc"
          test "$(command -v cargo)" = "$nightly_cargo"
          rustc -vV | tee -a .artifacts/ci/miri/setup.log
          grep -Fx 'host: x86_64-unknown-linux-gnu' .artifacts/ci/miri/setup.log
          rustdoc --version | tee -a .artifacts/ci/miri/setup.log
          cargo -vV | tee -a .artifacts/ci/miri/setup.log
          miri --version | tee -a .artifacts/ci/miri/setup.log
          rustup component list --toolchain nightly-2026-10-02 --installed | tee -a .artifacts/ci/miri/setup.log
          grep -Fx 'miri-x86_64-unknown-linux-gnu' .artifacts/ci/miri/setup.log
          grep -Fx 'rust-src' .artifacts/ci/miri/setup.log
          cargo miri setup 2>&1 | tee -a .artifacts/ci/miri/setup.log
      - name: Run exact Kairos FFI integration target under Miri
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-10-02
        run: |
          set -o pipefail
          nightly_rustc="$(rustup which rustc --toolchain nightly-2026-10-02)"
          nightly_bin="$(dirname "$nightly_rustc")"
          nightly_cargo="$nightly_bin/cargo"
          export PATH="$nightly_bin:$PATH"
          export RUSTDOC="$nightly_bin/rustdoc"
          export MIRI="$nightly_bin/miri"
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(command -v rustc)" = "$nightly_rustc"
          test "$(command -v cargo)" = "$nightly_cargo"
          cargo miri test --manifest-path libs/kairos/Cargo.toml -p kairo-ecs-ffi --test ffi_integration --locked 2>&1 | tee .artifacts/ci/miri/test.log
          test -s .artifacts/ci/miri/test.log
      - name: Retain bounded Miri setup and test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: selective-miri-logs
          path: .artifacts/ci/miri/*.log
          retention-days: 7
          if-no-files-found: ignore

  doctest:
    timeout-minutes: 15
    name: doctest
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust 1.99.0
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Documentation tests
        run: cargo +1.99.0 test --doc --workspace --all-features --locked

  context:
    timeout-minutes: 20
    name: context
    needs: scope
    if: needs.scope.outputs.context == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Check Conductor context and exact Kairos contract
        run: |
          python3 tools/check_kairos_pin.py
          python3 tools/context.py check
          python3 tools/tasks.py check
          python3 tools/mvp.py check
      - name: Install locked harness dependencies
        run: |
          python3 -m venv .artifacts/ci/harness-venv
          .artifacts/ci/harness-venv/bin/pip install -r requirements-schema-validation.txt
      - name: Run harness and incompatible-pin regressions
        run: .artifacts/ci/harness-venv/bin/python -m unittest discover -s tests -v
      - name: Check reviewed support and flaky-test inventory
        run: |
          python3 tools/quality_support.py --root .
          python3 tools/quality_flakes.py --config .config/d33-quality-gates.json
      - name: Measure bounded synthetic ED library coverage
        if: needs.scope.outputs.native == 'true'
        run: |
          set -euo pipefail
          mkdir -p .artifacts/ci/d33/bin
          rustup toolchain install 1.99.0 --profile minimal --component llvm-tools
          archive=.artifacts/ci/d33/cargo-llvm-cov.tar.gz
          curl --fail --location --max-time 90 https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.9.1/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz --output "$archive"
          echo "b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C .artifacts/ci/d33/bin cargo-llvm-cov
          export PATH="$PWD/.artifacts/ci/d33/bin:$PATH"
          cargo-llvm-cov llvm-cov --version | grep -E '^cargo-llvm-cov 0\.9\.1($| )'
          export RUSTUP_TOOLCHAIN=1.99.0
          RUSTC="$(rustup which rustc --toolchain 1.99.0)"
          export RUSTC
          RUSTDOC="$(rustup which rustdoc --toolchain 1.99.0)"
          export RUSTDOC
          "$RUSTC" --version | grep -E '^rustc 1\.99\.0 '
          "$RUSTDOC" --version | grep -E '^rustdoc 1\.99\.0 '
          cargo +1.99.0 -V | grep -E '^cargo 1\.99\.0 '
          cargo +1.99.0 llvm-cov --locked --package careops-ed --all-features --all-targets --json --output-path .artifacts/ci/d33/coverage.json
          python3 tools/quality_metrics.py --coverage .artifacts/ci/d33/coverage.json --config .config/d33-quality-gates.json
      - name: Check current-source critical ED mutations
        if: needs.scope.outputs.native == 'true'
        run: |
          set -euo pipefail
          mkdir -p .artifacts/ci/d33/bin
          archive=.artifacts/ci/d33/cargo-mutants.tar.gz
          curl --fail --location --max-time 90 https://github.com/sourcefrog/cargo-mutants/releases/download/v27.1.0/cargo-mutants-x86_64-unknown-linux-gnu.tar.gz --output "$archive"
          echo "dfe6dc37d0342c891d2829b5a695aa57c2d0edecef7e7d0399a30cc6e206411e  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C .artifacts/ci/d33/bin cargo-mutants
          export PATH="$PWD/.artifacts/ci/d33/bin:$PATH"
          cargo-mutants mutants --version | grep -E '^cargo-mutants 27\.1\.0($| )'
          export RUSTUP_TOOLCHAIN=1.99.0
          RUSTC="$(rustup which rustc --toolchain 1.99.0)"
          export RUSTC
          RUSTDOC="$(rustup which rustdoc --toolchain 1.99.0)"
          export RUSTDOC
          set +e
          cargo +1.99.0 mutants --cargo-arg=--locked --manifest-path crates/careops-ed/Cargo.toml --package careops-ed --file crates/careops-ed/src/lib.rs --gitignore=true --jobs 2 --timeout 180 --output .artifacts/ci/d33/mutations >.artifacts/ci/d33/mutations.log 2>&1
          status=$?
          set -e
          if [ "$status" != 0 ] && [ "$status" != 2 ]; then
            cat .artifacts/ci/d33/mutations.log
            exit "$status"
          fi
          cargo_path="$(rustup which cargo --toolchain 1.99.0)"
          python3 tools/quality_mutations.py --outcomes .artifacts/ci/d33/mutations/mutants.out/outcomes.json --source crates/careops-ed/src/lib.rs --cargo "$cargo_path"
      - name: Retain bounded D3.3 quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d33-quality-${{ github.run_id }}
          path: |
            .artifacts/ci/d33/coverage.json
            .artifacts/ci/d33/mutations.log
            .artifacts/ci/d33/mutations/mutants.out/outcomes.json
            .artifacts/ci/d33/mutations/mutants.out/mutants.json
            .artifacts/ci/d33/mutations/mutants.out/missed.txt
            .artifacts/ci/d33/mutations/mutants.out/unviable.txt
          if-no-files-found: warn
          retention-days: 7

  policy:
    name: policy
    timeout-minutes: 15
    needs: scope
    if: needs.scope.outputs.policy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Install reviewed checksum-bound policy binaries
        run: |
          mkdir -p .artifacts/ci/policy
          set -o pipefail
          python3 tools/install_ci_tools.py 2>&1 | tee .artifacts/ci/policy/install.log
      - name: Install Rust 1.99.0
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Check all dependency, secret and workflow policies
        run: |
          export RUSTUP_TOOLCHAIN=1.99.0
          python3 tools/ci_policy.py
          cargo deny --manifest-path fuzz/Cargo.toml --config fuzz/deny.toml --locked check
      - name: Retain bounded failed policy logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: policy-failure
          path: .artifacts/ci/policy/
          retention-days: 7
          if-no-files-found: error

  required:
    timeout-minutes: 5
    name: Required checks
    if: always()
    needs: [scope, fmt, clippy, test, msrv, fuzz, miri, doctest, context, policy]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required lanes and report unchanged scope
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SCOPE_CHANGED: ${{ needs.scope.outputs.changed }}
          SCOPE_NATIVE: ${{ needs.scope.outputs.native }}
          SCOPE_CONTEXT: ${{ needs.scope.outputs.context }}
          SCOPE_POLICY: ${{ needs.scope.outputs.policy }}
          FMT_RESULT: ${{ needs.fmt.result }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
          TEST_RESULT: ${{ needs.test.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
          MIRI_RESULT: ${{ needs.miri.result }}
          DOCTEST_RESULT: ${{ needs.doctest.result }}
          CONTEXT_RESULT: ${{ needs.context.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
        run: |
          set -eu
          if [ "$SCOPE_RESULT" != success ]; then
            echo "scope detection failed: $SCOPE_RESULT"
            exit 1
          fi
          for selector in "$SCOPE_CHANGED" "$SCOPE_NATIVE" "$SCOPE_CONTEXT" "$SCOPE_POLICY"; do
            if [ "$selector" != true ] && [ "$selector" != false ]; then
              echo "invalid scope output: $selector"
              exit 1
            fi
          done
          expected_changed=false
          if [ "$SCOPE_NATIVE" = true ] || [ "$SCOPE_CONTEXT" = true ] || [ "$SCOPE_POLICY" = true ]; then
            expected_changed=true
          fi
          if [ "$SCOPE_CHANGED" != "$expected_changed" ]; then
            echo "inconsistent changed selector: changed=$SCOPE_CHANGED expected=$expected_changed"
            exit 1
          fi
          expect_lane() {
            lane="$1"
            selected="$2"
            result="$3"
            if [ "$selected" = true ] && [ "$result" != success ]; then
              echo "selected required lane $lane did not succeed: $result"
              exit 1
            fi
            if [ "$selected" = false ] && [ "$result" != skipped ]; then
              echo "unselected required lane $lane was not skipped: $result"
              exit 1
            fi
          }
          expect_lane fmt "$SCOPE_NATIVE" "$FMT_RESULT"
          expect_lane clippy "$SCOPE_NATIVE" "$CLIPPY_RESULT"
          expect_lane test "$SCOPE_NATIVE" "$TEST_RESULT"
          expect_lane msrv "$SCOPE_NATIVE" "$MSRV_RESULT"
          expect_lane fuzz "$SCOPE_NATIVE" "$FUZZ_RESULT"
          expect_lane miri "$SCOPE_NATIVE" "$MIRI_RESULT"
          expect_lane doctest "$SCOPE_NATIVE" "$DOCTEST_RESULT"
          expect_lane context "$SCOPE_CONTEXT" "$CONTEXT_RESULT"
          expect_lane policy "$SCOPE_POLICY" "$POLICY_RESULT"
          echo "all selected required lanes passed; changed=$SCOPE_CHANGED"
