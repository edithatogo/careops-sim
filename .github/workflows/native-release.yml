name: Native CLI release candidate
on:
  pull_request:
    paths: ['.github/workflows/native-release.yml', 'tools/package_native_release.py', 'tests/test_native_release_package.py', 'tests/ed/native_cli_support.py', 'Cargo.toml', 'Cargo.lock', 'crates/**', 'libs/kairos', 'LICENSE', 'NOTICE', 'rust-toolchain.toml']
  push:
    branches: [main]
    paths: ['.github/workflows/native-release.yml', 'tools/package_native_release.py', 'tests/test_native_release_package.py', 'tests/ed/native_cli_support.py', 'Cargo.toml', 'Cargo.lock', 'crates/**', 'libs/kairos', 'LICENSE', 'NOTICE', 'rust-toolchain.toml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: Compile, package and exercise actual native CLI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15.1'
      - name: Verify repository-local Python 3.15.1
        run: python tools/python_runtime.py --github
      - name: Verify packaging refusal and integrity regressions
        run: |
          "$CAREOPS_PYTHON" -m unittest discover -s tests -p test_native_release_package.py -v
      - name: Install the qualified independent native reader
        run: |
          "$CAREOPS_PYTHON" -m pip install -r crates/careops-birthing-cli/requirements-reader.txt
          "$CAREOPS_PYTHON" -c 'import sys, pyarrow; assert sys.version_info[:3] == (3, 15, 1); assert pyarrow.__version__ == "26.0.0"'
      - name: Compile once using the canonical locked Rust lane
        run: |
          toolchain=$("$CAREOPS_PYTHON" -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal
          rustup run "$toolchain" rustc -vV
          rustup run "$toolchain" cargo build --locked --release --package careops-ed-cli --bin careops-ed
      - name: Package compiled bytes without rehearsal substitutions
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          git diff --exit-code
          "$CAREOPS_PYTHON" tools/package_native_release.py --binary target/release/careops-ed --license LICENSE --notice project=NOTICE --notice kairos/LICENSE=libs/kairos/LICENSE --notice kairos/LICENSE-APACHE=libs/kairos/LICENSE-APACHE --notice kairos/LICENSE-MIT=libs/kairos/LICENSE-MIT --notice kairos/LICENSE.md=libs/kairos/LICENSE.md --scenario crates/careops-ed/examples/nominal_mvp.json --source-commit "$SOURCE_COMMIT" --created-epoch "$(git show -s --format=%ct "$SOURCE_COMMIT")" --output dist/careops-sim-linux-x64.zip
          cp Cargo.lock dist/resolved-workspace.Cargo.lock
      - name: Exercise the unpacked CLI outside the source tree
        run: |
          mkdir -p "$RUNNER_TEMP/native-consumer"
          unzip -q dist/careops-sim-linux-x64.zip -d "$RUNNER_TEMP/native-consumer"
          cd "$RUNNER_TEMP/native-consumer" || exit 1
          bin/careops-ed --help > help.txt
          grep -F 'Usage: careops-ed' help.txt
          grep -F 'Software verification of simulation mechanics does NOT constitute clinical domain validation for any healthcare site.' help.txt
          bin/careops-ed validate examples/nominal_mvp.json
          bin/careops-ed run examples/nominal_mvp.json --seed 42 --output-dir result > result-control.json
          bin/careops-ed run examples/nominal_mvp.json --seed 42 --output-dir result-repeat > result-repeat-control.json
          bin/careops-ed compare result/data result-repeat/data > comparison.json
          printf '{}\n' > invalid.json
          invalid_status=0
          bin/careops-ed validate invalid.json > invalid-result.txt 2>&1 || invalid_status=$?
          test "$invalid_status" -eq 4
          grep -F "MALFORMED_CONFIG (4)" invalid-result.txt
          PYTHONPATH="$GITHUB_WORKSPACE" "$CAREOPS_PYTHON" - <<'PYCODE'
          import hashlib, json
          from pathlib import Path
          from tests.ed.native_cli_support import read_run, control
          scenario_path = Path('examples/nominal_mvp.json')
          scenario = json.loads(scenario_path.read_text())
          assert scenario['provenance']['class'] == 'synthetic'
          package = control('build.json')
          assert package['binarySha256'] == hashlib.sha256(Path('bin/careops-ed').read_bytes()).hexdigest()
          datasets = []
          for name in ['result', 'result-repeat']:
              root = Path(name)
              assert control(root / 'manifest.json') == control(name + '-control.json')
              manifest, tables = read_run(root)
              assert manifest['format'] == 'parquet' and manifest['compression'] == 'zstd'
              assert control(root / 'invocation.json')['raw_input_sha256'] == hashlib.sha256(scenario_path.read_bytes()).hexdigest()
              assert manifest['base_seed'] == 42 and manifest['replication_seeds'] == [42]
              assert manifest['scenario_id'] == scenario['scenario_id'] and manifest['time_unit'] == 'tick'
              patients, replications = tables['patients'].to_pylist(), tables['replications'].to_pylist()
              assert len(patients) == 5 and len(replications) == 1 and tables['metrics'].num_rows == 5
              assert {p['patient_id'] for p in patients} == {f'patient-{n:03}' for n in range(1, 6)}
              assert all(p['status'] == 'completed' and p['arrival_tick_hi'] == p['start_tick_hi'] == p['completion_tick_hi'] == 0 and p['arrival_tick_lo'] <= p['start_tick_lo'] <= p['completion_tick_lo'] for p in patients)
              assert replications[0]['arrivals'] == replications[0]['started'] == replications[0]['completed'] == 5
              assert replications[0]['unfinished'] == 0 and replications[0]['seed'] == 42
              datasets.append(tables)
          assert all(datasets[0][name].equals(datasets[1][name], check_metadata=False) for name in datasets[0])
          comparison = control('comparison.json')
          assert comparison['schema'] == 'careops.ed.native-comparison.v1'
          assert len(comparison['metrics']) == 5 and all(row['delta'] == 0 for row in comparison['metrics'])
          Path('consumer-result.json').write_text(json.dumps({'schema': 'careops.native-package-consumer.v1', 'binary_sha256': package['binarySha256'], 'repeat_equal': True, 'comparison_equal': True, 'table_rows': {k: v.num_rows for k, v in datasets[0].items()}}) + '\n')
          PYCODE
          cp consumer-result.json "$GITHUB_WORKSPACE/dist/consumer-result.json"
      - name: Read immutable qualified artifact tooling
        shell: bash
        run: |
          set -euo pipefail
          # Exact source edithatogo/careops@5cf006bce6c37c0c15db5d35055e302701a500ad; inherited licence retained.
          test ! -e "$GITHUB_WORKSPACE/.artifacts/ci-release-policy"
          cd "$GITHUB_WORKSPACE/.careops-security/upstream/5cf006bce6c37c0c15db5d35055e302701a500ad"
          sha256sum --check SHA256SUMS
          mkdir -p "$GITHUB_WORKSPACE/.artifacts/ci-release-policy"
          cp -R . "$GITHUB_WORKSPACE/.artifacts/ci-release-policy/"
      - name: Inventory exact compiled package bytes
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          "$CAREOPS_PYTHON" .artifacts/ci-release-policy/portfolio-scripts/artifact_sbom.py --artifact dist/careops-sim-linux-x64.zip --name careops-sim-linux-x64 --source-commit "$SOURCE_COMMIT" --created-epoch "$(git show -s --format=%ct "$SOURCE_COMMIT")" --output dist/careops-sim.spdx.json
      - name: Preserve actual package and source resolution inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: careops-sim-linux-x64
          path: dist/
          if-no-files-found: error
          retention-days: 30
  attest-package:
    name: Attest main source package
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Federated signing for the exact previously built package.
      attestations: write # Store package provenance and SPDX signatures only.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the qualified verification runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.15.1'
      - name: Verify repository-local Python 3.15.1
        run: python tools/python_runtime.py --github
      - name: Download the package built once by this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: careops-sim-linux-x64
          path: candidate
      - name: Independently compare downloaded package with its inventory
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          "$CAREOPS_PYTHON" - <<'PYCODE'
          import hashlib, json, os, zipfile
          from pathlib import Path
          package = Path('candidate/careops-sim-linux-x64.zip')
          document = json.loads(Path('candidate/careops-sim.spdx.json').read_text())
          assert document['packages'][0]['sourceInfo'] == 'Source commit: ' + os.environ['SOURCE_COMMIT']
          assert document['packages'][0]['checksums'][0]['checksumValue'] == hashlib.sha256(package.read_bytes()).hexdigest()
          with zipfile.ZipFile(package) as archive:
              entries = [entry for entry in archive.infolist() if not entry.is_dir()]
              assert len({entry.filename for entry in entries}) == len(entries)
              actual = {entry.filename: hashlib.sha256(archive.read(entry)).hexdigest() for entry in entries}
          declared = {entry['fileName'].removeprefix('./'): next(c['checksumValue'] for c in entry['checksums'] if c['algorithm'] == 'SHA256') for entry in document['files']}
          assert actual and len(declared) == len(document['files']) and actual == declared
          print('Exact downloaded archive and all file digests match the inventory.')
          PYCODE
      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: candidate/careops-sim-linux-x64.zip
          create-storage-record: false
      - name: Attest exact artifact inventory
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: candidate/careops-sim-linux-x64.zip
          sbom-path: candidate/careops-sim.spdx.json
          create-storage-record: false
      - name: Verify exact source and workflow signatures
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" candidate/build-attestation.jsonl
          cp "$SBOM_BUNDLE" candidate/sbom-attestation.jsonl
          gh attestation verify candidate/careops-sim-linux-x64.zip --bundle "$PROVENANCE_BUNDLE" --repo edithatogo/careops-sim --signer-workflow edithatogo/careops-sim/.github/workflows/native-release.yml --source-ref refs/heads/main --source-digest "$SOURCE_COMMIT" --signer-digest "$SOURCE_COMMIT" --deny-self-hosted-runners --format json > candidate/provenance-verification.json
          gh attestation verify candidate/careops-sim-linux-x64.zip --bundle "$SBOM_BUNDLE" --repo edithatogo/careops-sim --signer-workflow edithatogo/careops-sim/.github/workflows/native-release.yml --source-ref refs/heads/main --source-digest "$SOURCE_COMMIT" --signer-digest "$SOURCE_COMMIT" --deny-self-hosted-runners --predicate-type https://spdx.dev/Document/v2.3 --format json > candidate/sbom-verification.json
      - name: Preserve exact package and signature evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: careops-sim-attested-candidate-${{ github.sha }}
          path: candidate/
          if-no-files-found: error
          retention-days: 30
