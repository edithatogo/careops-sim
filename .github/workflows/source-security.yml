name: Shared source security
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: source-security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  security:
    uses: edithatogo/careops/.github/workflows/reusable-source-security.yml@5cf006bce6c37c0c15db5d35055e302701a500ad
    with:
      policy-revision: 5cf006bce6c37c0c15db5d35055e302701a500ad
