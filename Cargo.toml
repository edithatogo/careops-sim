[workspace]
resolver = "2"
members = ["crates/careops-core", "crates/careops-ed", "crates/careops-ed-cli"]

[workspace.package]
edition = "2021"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/edithatogo/careops-sim"

[package]
name = "careops-sim"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[workspace.dependencies]
careops-core = { path = "crates/careops-core" }
kairo-ecs-rng = { version = "=0.0.0", git = "https://github.com/edithatogo/kairos.git", rev = "07410266bf54b6f73c59db2f8cbfbc5697c53734" }
kairo-ecs-core = { version = "=0.0.0", git = "https://github.com/edithatogo/kairos.git", rev = "07410266bf54b6f73c59db2f8cbfbc5697c53734" }
kairo-ecs-des = { version = "=0.1.0", git = "https://github.com/edithatogo/kairos.git", rev = "07410266bf54b6f73c59db2f8cbfbc5697c53734" }
kairo-ecs-types = { version = "=0.0.0", git = "https://github.com/edithatogo/kairos.git", rev = "07410266bf54b6f73c59db2f8cbfbc5697c53734" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "=0.11.1"

[patch.crates-io]
hashbrown = { git = "https://github.com/pola-rs/hashbrown", rev = "d76a6f81abd8f388676aff15068236a8d21c7e1a" }
