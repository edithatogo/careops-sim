[package]
name = "careops-birthing-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "careops-birthing"
path = "src/main.rs"

[dependencies]
careops-birthing = { path = "../careops-birthing" }
careops-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
kairo-ecs-arrow = { git = "https://github.com/edithatogo/kairos.git", rev = "473ff2c0e640a7e457f500593f6ea1f06602ab35", version = "=0.1.0", features = ["polars-native"] }
kairo-data-types = { package = "kairo-ecs-types", git = "https://github.com/edithatogo/kairos.git", rev = "473ff2c0e640a7e457f500593f6ea1f06602ab35", version = "=0.0.0" }

polars = { git = "https://github.com/pola-rs/polars.git", rev = "96439685eb2f95108f51087d2b76091917f2593c", version = "=0.55.1", default-features = false, features = ["parquet"] }

[dev-dependencies]
tempfile = "=3.27.0"

[build-dependencies]
sha2.workspace = true
