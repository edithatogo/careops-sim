[package]
name = "careops-ed"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
careops-core.workspace = true
kairo-ecs-rng.workspace = true
kairo-ecs-core.workspace = true
kairo-ecs-types.workspace = true
serde.workspace = true
serde_json.workspace = true
kairo-ecs-arrow = { path = "../../libs/kairos/crates/kairo-ecs-arrow", features = ["polars-native"], optional = true }
polars = { version = "=0.45.1", default-features = false, features = ["parquet"], optional = true }
tempfile = { version = "3.17.1", optional = true }

[features]
default = ["native-data"]
native-data = ["dep:kairo-ecs-arrow", "dep:polars", "dep:tempfile"]
