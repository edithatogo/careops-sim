[advisories]
yanked = "deny"
unmaintained = "workspace"

[bans]
multiple-versions = "deny"
# Path versions are fixed by the reviewed gitlink; registry wildcard rejection is in ci_policy.py.
wildcards = "allow"
highlight = "all"
# Older transitive versions required by the pinned native data graph.
skip = [
  # Runtime and Arrow carry the same package version at separately pinned Kairos revisions.
  { name = "kairo-ecs-types", version = "=0.0.0" },
  { name = "base64", version = "=0.22.1" },
  { name = "core-foundation", version = "=0.9.4" },
  { name = "foldhash", version = "=0.1.5" },
  { name = "getrandom", version = "=0.2.17" },
  { name = "hashbrown", version = "=0.15.5" },
  { name = "io-lifetimes", version = "=2.0.4" },
  { name = "syn", version = "=2.0.119" },
  { name = "windows-sys", version = "=0.59.0" },
  { name = "windows-sys", version = "=0.60.2" },
  { name = "windows-targets", version = "=0.52.6" },
  { name = "windows_aarch64_gnullvm", version = "=0.52.6" },
  { name = "windows_aarch64_msvc", version = "=0.52.6" },
  { name = "windows_i686_gnu", version = "=0.52.6" },
  { name = "windows_i686_gnullvm", version = "=0.52.6" },
  { name = "windows_i686_msvc", version = "=0.52.6" },
  { name = "windows_x86_64_gnu", version = "=0.52.6" },
  { name = "windows_x86_64_gnullvm", version = "=0.52.6" },
  { name = "windows_x86_64_msvc", version = "=0.52.6" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "Unicode-3.0"]
confidence-threshold = 0.9
exceptions = [
  { name = "ar_archive_writer", version = "=0.5.3", allow = ["Apache-2.0 WITH LLVM-exception"] },
  { name = "aws-lc-rs", version = "=1.19.0", allow = ["ISC"] },
  { name = "aws-lc-sys", version = "=0.47.0", allow = ["ISC"] },
  { name = "foldhash", version = "=0.1.5", allow = ["Zlib"] },
  { name = "foldhash", version = "=0.2.0", allow = ["Zlib"] },
  { name = "rustls-webpki", version = "=0.103.16", allow = ["ISC"] },
  { name = "slotmap", version = "=1.1.1", allow = ["Zlib"] },
  { name = "untrusted", version = "=0.9.0", allow = ["ISC"] },
  { name = "webpki-root-certs", version = "=1.0.11", allow = ["CDLA-Permissive-2.0"] },
  { name = "winx", version = "=0.36.4", allow = ["Apache-2.0 WITH LLVM-exception"] },
  { name = "xxhash-rust", version = "=0.8.19", allow = ["BSL-1.0"] },
  { name = "zlib-rs", version = "=0.6.8", allow = ["Zlib"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/edithatogo/kairos", "https://github.com/pola-rs/polars", "https://github.com/pola-rs/hashbrown"]
required-git-spec = "rev"
