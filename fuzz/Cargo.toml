[package]
name = "careops-ed-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]
resolver = "3"

[dependencies]
careops-ed = { path = "../crates/careops-ed", version = "=0.1.0" }
libfuzzer-sys = "=0.4.13"
serde_json = "=1.0.151"

[[bin]]
name = "parse_scenario_json"
path = "fuzz_targets/parse_scenario_json.rs"
test = false
doc = false
bench = false
